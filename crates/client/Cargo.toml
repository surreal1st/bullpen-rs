[package]
name = "client"
version.workspace = true
edition.workspace = true

[dependencies]
shared = { workspace = true }
dioxus = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# S13a-01b: `memory_editor.rs::format_ttl`, `routines_editor.rs::format_when`
# (no locale dependency, so one implementation on both platforms) and
# `message_time.rs`'s native half (`message_time/native.rs`, which does
# split on platform - see that module's doc).
chrono = { workspace = true }
# S1-07a: `StreamExt` for the eventsource stream in events.rs. Already a
# workspace dependency (server-side); reused here rather than adding a
# second futures-utility crate.
futures = { workspace = true }
# S1-07a: markdown -> `rsx!` for a bot's reply (markdown.rs), never
# `dangerous_inner_html` - see that module's doc comment for why. The one
# new dependency this ticket adds.
pulldown-cmark = "0.13"
# S1-07a: the SSE run stream reads its response body as a raw
# `web_sys::ReadableStream` (api.rs) - `gloo-net`'s `Response::body()`
# already returns one, but consuming it needs the reader type explicitly,
# which is not part of `gloo-net`'s own feature set.
# S1-F-11: `RequestCredentials` - the gate's login POST is explicit about
# sending cookies (`api.rs::login`) rather than relying on fetch's
# same-origin default.
# S5b-07: `Window`/`Navigator`/`Clipboard` - the "Copy secret"/"Copy URL"
# buttons on a freshly minted webhook secret (`routines_editor.rs::
# copy_to_clipboard`) call `navigator.clipboard.writeText`, each type gated
# behind its own web-sys feature. 🔴 S13a-01b: still unconditional, and
# `copy_to_clipboard` itself is still unguarded by any `#[cfg]` - out of
# this ticket's three named patterns (spawn/dates/gloo), found while
# reading `routines_editor.rs` for its `Date` fix, not fixed here. On
# native it compiles (`web-sys` builds off wasm32 the same way `js-sys`
# does) but `web_sys::window()` returns `None` there at runtime, so the
# button silently does nothing on desktop instead of copying - flagged in
# this ticket's `## Results` for a follow-up.
web-sys = { version = "0.3", features = [
    "ReadableStreamDefaultReader",
    "RequestCredentials",
    "Window",
    "Navigator",
    "Clipboard",
] }
js-sys = "0.3"
wasm-bindgen = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# S13a-01 named these for wasm32-only gating and found (by hand) that
# `app.rs`, `routines_editor.rs`, `settings.rs` and `slack_card.rs` still
# called them unconditionally, so gating broke native `cargo check` with 4
# errors - see that ticket's `## Results`. S13a-01b routed all four (plus
# `events.rs`'s task-spawning, `memory_editor.rs`/`working_bar.rs`/
# `approvals.rs`/`questions.rs`'s `spawn_local`, and every `js_sys::Date`
# call) through `transport`/`message_time`'s wasm32-vs-native split, so
# these finally move here clean. **Bite**: reintroducing an unconditional
# `gloo_net`/`gloo_timers` import into any native code path now fails
# `cargo check -p client` with "can't find crate" (see this ticket's
# `## Results` for the literal error) - that failure IS the seam.
gloo-net = { version = "0.6", default-features = false, features = ["http", "json", "eventsource"] }
gloo-timers = { version = "0.3", features = ["futures"] }
wasm-bindgen-futures = "0.4"

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# S13a-01: the native half of `transport::Request`/`Response`
# (`src/transport/native.rs`) - rustls only, never native-tls, see that
# module's doc on why - plus the shared cookie-jar client that keeps
# `login`'s session across requests the way a browser's own cookie jar
# does for the web build.
reqwest = { workspace = true, features = ["cookies"] }
# events.rs's native reconnect delay (`run()`'s 3s backoff - `gloo-timers`'
# `TimeoutFuture` on web). `dioxus-desktop` already depends on tokio with
# "full", so this only needs to name what this crate calls directly: the
# sleep itself, plus what `#[tokio::test]` needs for native.rs's own tests.
tokio = { version = "1", features = ["time", "rt", "macros"] }
