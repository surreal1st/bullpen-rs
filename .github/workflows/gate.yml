# CI signal on every push/PR to main. Authoritative gate for ship remains
# workstation Git Bash: ./scripts/gate.sh (zigbuild release path + dx client policy).
#
# Native-host client is excluded from clippy/test: even default `web` pulls wry/wayland
# on linux-gnu and needs a GUI dev stack ubuntu-latest does not ship. Client coverage
# here is wasm32-only (default web features), matching gate.sh's wasm check; gate.sh
# on Git Bash still runs `--all-features` clippy/test for desktop/mobile on the workstation.
name: gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --exclude client -- -D warnings

      - name: cargo test
        run: cargo test --workspace --no-fail-fast --exclude client

      - name: release build (server)
        run: cargo build --release -p server

      - name: wasm32 client check
        run: cargo check -p client --target wasm32-unknown-unknown

      - name: Note authoritative gate
        run: |
          echo "Ubuntu CI passed (server crates + wasm32 client; no native-host client GTK/wayland). Ship still requires Git Bash ./scripts/gate.sh (musl zigbuild, --all-features, dx web release)."
