[package]
name = "server"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "bullpen"
path = "src/main.rs"

[dependencies]
shared = { workspace = true }
store = { workspace = true }
model = { workspace = true }
# S1-05: `runs.rs` writes the `runs` row with raw SQL against `Db::conn()`,
# same as `store` itself does - no query API for that table exists yet.
rusqlite = { workspace = true }
# S2-F-04: `spend::OpenRouterCredits` reads OpenRouter's credits endpoint
# directly, the same way `model::catalog::OpenRouterCatalog` does - a
# `CreditsPort` trait object needs `async-trait` for the same reason
# `model::Catalog` does.
reqwest = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
async-stream = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
futures = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
hex = { workspace = true }
regex = { workspace = true }
aes-gcm = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
# S6-07: `vm_proxy::serve`'s accept/route loop - see the root `Cargo.toml`'s
# comment for why these two and not a websocket crate.
hyper = { workspace = true }
hyper-util = { workspace = true }
# S6-W-05: `HttpCdp::create_window`/`call` - see the root `Cargo.toml`'s
# comment for the version pin and why.
tokio-tungstenite = { workspace = true }

# S8d-02: bounded full PNG validation for VM observations.
png = "0.17.16"

[dev-dependencies]
# S0-04: driving `build_app` in tests via `tower::ServiceExt::oneshot`, and
# seeding a session row directly for the auth tests.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
# S8d-05b: constrains the external recorder receive window so upload cancellation
# is observed before the production request body has fully entered the socket.
socket2 = "0.6.5"
# S1-05: `model::fake::FakePort` for the run-manager tests. `fake` is behind
# a feature because it is only `cfg(test)` inside the `model` crate itself;
# an integration test in `tests/` compiles `model` as an ordinary
# dependency, so this crate has to ask for the feature explicitly.
model = { workspace = true, features = ["fake"] }
