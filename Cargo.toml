[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"

[workspace.dependencies]
shared = { path = "crates/shared" }
store = { path = "crates/store" }
model = { path = "crates/model" }

async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
async-stream = "0.3"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace", "set-header"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2"] }
jsonwebtoken = { version = "9", default-features = false, features = ["use_pem"] }
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dioxus = { version = "0.7" }
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
hex = "0.4"
# S5b-06b: `hook_match`/`Condition.match` are user-supplied regex patterns
# (`new RegExp(row.hook_match, "i")` in TS) checked against a webhook's
# reduced text - not a fixed small grammar S5b-01's hand-scan approach fits,
# so this is a real new dependency, added and flagged per that ticket's own
# "tell me if you need one" rule.
regex = "1"
# S5c-01: AES-256-GCM encryption for settings at rest, TS-compatible
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
# S6-07: the accept-and-route wiring for `vm_proxy::serve` needs to take
# over a raw connection BEFORE any HTTP response is written (mirroring
# Node's `server.on("upgrade")` timing - see `vm_proxy.rs`'s own doc), which
# `axum::serve` has no hook for. Both are already transitive under axum
# (`axum::serve` is built on them); this exposes what's already in the tree
# rather than adding a stack. Approved by the orchestrator per
# `.scratch/bullpen-rs/tickets/S6-tickets.md` S6-07 - do not add a third
# HTTP/websocket crate without the same sign-off.
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "server", "tokio", "service"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "tls12", "webpki-tokio"] }
http-body-util = "0.1"
bytes = "1"
tower-service = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# S6-W-05: `HttpCdp::create_window`/`call` need a WebSocket client to open
# DevTools' per-target and per-browser sockets - approved by the
# orchestrator per `.scratch/bullpen-rs/tickets/S6-W-tickets.md` S6-W-03's
# Results (do not add a second WebSocket crate without the same sign-off).
# Pinned to `0.28` to match `tungstenite 0.28.0`, the version actually
# reachable from `crates/client`'s desktop feature per `cargo tree -p
# client -i tungstenite@0.28.0` (`dioxus-devtools -> dioxus`/`dioxus-web`) -
# NOT `0.27.0`, which is also in `Cargo.lock` but, per `cargo tree
# --workspace --target all --all-features -i tungstenite@0.27.0` printing
# nothing, is unreachable from any workspace member under any target or
# feature combination (a `dioxus-fullstack` dependency edge that never
# activates, since `client` builds with the `desktop` feature, not
# `fullstack`). Matching `0.27` as the ticket's text suggested would have
# introduced a THIRD tungstenite version rather than reusing one already
# resolved.
tokio-tungstenite = "0.28"

# Tests and dev builds run UNOPTIMISED, and scrypt at N=2^15 costs seconds
# per hash there instead of the ~100ms it costs in release. Measured: one
# auth test that hashes twice took 5.92s, and tests/auth.rs as a whole took
# 33s of the gate's 183s of test time - about 18% of it, for one file.
#
# Optimising ONLY this dependency leaves the production parameters and
# every assertion exactly as they are. The alternative - cheapening the
# scrypt parameters in test fixtures - would make the tests stop exercising
# the hashing Bullpen actually ships, which is the wrong thing to trade for
# 30 seconds.
[profile.dev.package.scrypt]
opt-level = 3

[profile.test.package.scrypt]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
