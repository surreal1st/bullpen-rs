[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"

[workspace.dependencies]
shared = { path = "crates/shared" }
store = { path = "crates/store" }
model = { path = "crates/model" }

async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
async-stream = "0.3"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace", "set-header"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dioxus = { version = "0.7" }
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
hex = "0.4"
# S5b-06b: `hook_match`/`Condition.match` are user-supplied regex patterns
# (`new RegExp(row.hook_match, "i")` in TS) checked against a webhook's
# reduced text - not a fixed small grammar S5b-01's hand-scan approach fits,
# so this is a real new dependency, added and flagged per that ticket's own
# "tell me if you need one" rule.
regex = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
