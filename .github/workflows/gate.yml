# CI signal on every push/PR to main. Authoritative gate for ship remains
# workstation Git Bash: ./scripts/gate.sh (zigbuild release path + dx client policy).
#
# Clippy/test omit --all-features: desktop+mobile enable dioxus GTK/WebKit (glib-sys)
# and need a full Linux GUI dev stack ubuntu-latest does not install by default.
# gate.sh --all-features on the workstation covers those cfgs; wasm32 client check
# below uses default web features only (same as gate.sh).
name: gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --no-fail-fast

      - name: release build (server)
        run: cargo build --release -p server

      - name: wasm32 client check
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check -p client --target wasm32-unknown-unknown

      - name: Note authoritative gate
        run: |
          echo "Ubuntu CI passed (no --all-features; desktop/mobile GTK). Ship still requires Git Bash ./scripts/gate.sh on the workstation (musl zigbuild, --all-features, dx web release)."
