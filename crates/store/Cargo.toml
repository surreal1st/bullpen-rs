[package]
name = "store"
version.workspace = true
edition.workspace = true

[dependencies]
shared = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
base64 = { workspace = true }
# S1-F-05: scrypt password hashing for the login route (`auth.rs`'s
# `hash_password`/`verify_password`), porting the TS `auth.ts` scrypt calls.
# The one new dependency this ticket adds - default features, using only the
# low-level `scrypt(password, salt, params, output)` function, never the
# crate's own `password-hash`-based salt/token generation (which needs
# `rand_core`): `auth.rs::random_bytes` sources randomness from `uuid`
# instead, already a `store` dependency. `password-hash` still appears in
# `Cargo.lock` regardless - it is one of `scrypt`'s own unconditional
# dependencies, not something this crate opted into.
scrypt = "0.11"
